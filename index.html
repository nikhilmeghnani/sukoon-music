<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Sukoon. Music for quiet nights, long drives and peaceful moments."
  >

  <title>Sukoon | Music for the Soul</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <!-- Color + readability adjustments -->
  <style>
    :root {
      --sukoon-brown: #3B1F1A;
      --sukoon-brown-soft: #5A352C;
      --sukoon-terracotta: #C85F3D;
      --sukoon-red: #D9574F;
      --sukoon-cream: #FFF3DF;
      --sukoon-muted: #765C52;
    }

    /*
      Central readability layer.
      This makes the text readable over the person,
      guitar and bright sunset without looking like a box.
    */
    .hero-content {
      position: relative;
      isolation: isolate;
    }

    .hero-content::before {
      content: "";
      position: absolute;

      width: 760px;
      height: 500px;

      left: 50%;
      top: 48%;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 235, 205, 0.38) 0%,
          rgba(255, 235, 205, 0.20) 35%,
          rgba(255, 235, 205, 0.07) 58%,
          transparent 75%
        );

      filter: blur(12px);

      z-index: -1;
      pointer-events: none;
    }

    /* Main Sukoon logo */
    .hero-content h1 {
      color: var(--sukoon-brown) !important;

      text-shadow:
        0 2px 8px rgba(255, 240, 215, 0.45),
        0 4px 20px rgba(60, 30, 20, 0.08);
    }

    /* Feel the music */
    .script-line {
      color: var(--sukoon-terracotta) !important;

      text-shadow:
        0 1px 8px rgba(255, 235, 210, 0.5);
    }

    /* Hindi Sukoon */
    .hindi {
      color: var(--sukoon-red) !important;

      text-shadow:
        0 2px 8px rgba(255, 235, 215, 0.5);
    }

    /* Small decorative lines */
    .wave-line {
      color: var(--sukoon-terracotta) !important;
    }

    /* MUSIC • MEMORIES • MOMENTS */
    .eyebrow {
      color: var(--sukoon-brown-soft) !important;

      text-shadow:
        0 1px 5px rgba(255, 235, 210, 0.6);
    }

    /* Description */
    .description {
      color: var(--sukoon-brown-soft) !important;

      text-shadow:
        0 1px 6px rgba(255, 240, 220, 0.55);
    }

    .description strong {
      color: var(--sukoon-brown) !important;
    }

    /* Brand */
    .brand {
      color: var(--sukoon-brown) !important;
    }

    .brand span {
      color: var(--sukoon-terracotta) !important;
    }

    /* Listening indicator */
    .online {
      color: var(--sukoon-brown-soft) !important;
    }

    /* Social icons */
    .topbar nav a {
      color: var(--sukoon-brown) !important;
    }

    /* Playlist heading */
    .panel-title {
      color: var(--sukoon-brown) !important;
    }

    .panel-title span {
      color: var(--sukoon-terracotta) !important;
    }

    /* Playlist titles */
    .playlist-item strong {
      color: var(--sukoon-brown) !important;
    }

    .playlist-item small {
      color: var(--sukoon-muted) !important;
    }

    .playlist-item .arrow {
      color: var(--sukoon-terracotta) !important;
    }

    /* Author */
    .description strong {
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /*
      Slightly stronger text shadow only on the main logo.
      Keeps it readable when it crosses the person's face.
    */
    .hero-content h1 {
      -webkit-text-stroke: 0.3px rgba(59, 31, 26, 0.12);
    }
  </style>
</head>

<body>

        </svg>
      </a>

    </nav>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <main class="hero">

    <section class="hero-content">

      <p class="eyebrow">
        MUSIC • MEMORIES • MOMENTS
      </p>

      <!-- <div class="script-line">
        feel the music
      </div> -->

      <h1>
        sukoon
      </h1>

      <div class="hindi-wrap">

        <span class="wave-line">
          〰〰
        </span>

        <div class="hindi">
          सुकून
        </div>

        <span class="wave-line">
          〰〰
        </span>

      </div>

      <p class="description">

        <strong>
          By Nikhil Meghnani
        </strong>

        <br>

        Music for quiet nights,

        <br>

        long drives and peaceful moments.

      </p>

    </section>


    <!-- Scroll Button -->

    <button
      class="scroll-button"
      onclick="document.getElementById('player').scrollIntoView({behavior:'smooth'})"
      aria-label="Scroll to music player"

      ↓
    </button>

  </main>


  <!-- =========================

      </span>

      <div>

        <strong>
          Arijit Essentials
        </strong>

        </small>

      </div>

      </span>

      </span>

        <strong>

      </span>

        </small>

        ▶

    <!-- Road Trip -->

      class="playlist-item"
      data-playlist="JOGxn-nmvXI"
      data-title="Road Trip"

    >

      <span class="emoji">

      </span>

      <div>

        </small>

  <!-- =========================
       MUSIC PLAYER
  ========================== -->

  <section
    class="music-player"
    id="player"
  >

    <div class="album-art">

      <div class="album-sun"></div>

      <span>
        sukoon
      </span>

      <div class="album-wave">
        ▁▃▅▃▁
      </div>

    </div>


    <div class="track-details">

      <div class="track-title">
        Arijit Singh • Essentials
      </div>

      <div class="track-artist">
        The best of Arijit Singh
      </div>

      <div class="progress-row">

        <span class="dot"></span>

        <div class="progress-track">
          <span></span>
        </div>

        <span class="duration">
          5:48
        </span>

      </div>

    </div>


    <div class="player-controls">

      <button
        class="control"
        id="prevBtn"
        aria-label="Previous song"
      >
        |◀
      </button>


      <button
        class="play"
        id="playBtn"
        aria-label="Play"
      >
        ▶
      </button>


      <button
        class="control"
        id="nextBtn"
        aria-label="Next song"
      >
        ▶|
      </button>

    </div>

  </section>


  <!-- Hidden YouTube player -->

  <div
    id="youtube-player"
    aria-label="YouTube player"
